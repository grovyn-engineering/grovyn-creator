name: socialpilot

services:
  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - path: ./backend/.env.production
        required: false
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    healthcheck:
      disable: true
    restart: on-failure

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/server.js"]
    env_file:
      - path: ./backend/.env.production
        required: false
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    env_file:
      - path: ./backend/.env.production
        required: false
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - path: ./frontend/.env.production
        required: false
      - path: ./frontend/.env.local
        required: false
      - path: .env
        required: false
    depends_on:
      - backend-api
    restart: always
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-api
    restart: always

volumes:
  redis-data:
