name: socialpilot

services:
  # ── Database Migration Runner ─────────────────────────────
  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - ./backend/.env.production
    restart: on-failure

  # ── Backend API Server ───────────────────────────────────
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/server.js"]
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Backend Worker Process (BullMQ Queue Worker) ────────
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    env_file:
      - ./backend/.env.production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always

  # ── Frontend Next.js Web App ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend-api
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Redis Cache & Queue Server ───────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx Reverse Proxy & SSL Router ─────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-api
    restart: always

volumes:
  redis-data:
